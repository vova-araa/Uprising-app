# Render Blueprint — Uprising Studio frontend (Vite static site).
# In Render: New + → "Blueprint" → kies deze repo → Render leest dit bestand.
# De drie VITE_-variabelen zet je daarna in het Render-dashboard (sync: false,
# dus niet in git). Dit zijn PUBLIEKE Supabase-waarden (URL + publishable key) —
# geen geheimen. Secret keys (Stripe, Nuki, ...) horen ALLEEN in Supabase, nooit hier.
services:
  - type: web
    name: uprising-studio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
    # SPA-fallback: elke route serveert index.html (veilig; ook goed als je ooit
    # van HashRouter naar BrowserRouter overstapt).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
