    <style>
      /* Critical inline CSS – painted before JS loads to improve FCP */
      body{margin:0;background:#08070d;color:#f5f5f5;font-family:'DM Sans','Space Grotesk',system-ui,sans-serif}
      #root-skeleton{display:flex;align-items:center;justify-content:center;min-height:100dvh;opacity:1;transition:opacity .2s}
      #root-skeleton img{width:64px;height:64px;border-radius:16px;animation:sk-pulse 1.5s ease-in-out infinite}
      @keyframes sk-pulse{0%,100%{opacity:1}50%{opacity:.5}}
      #root:not(:empty)+#root-skeleton{display:none}
      /* Fail-safe error display for native debugging */
      #native-error-overlay{display:none;position:fixed;inset:0;z-index:99999;background:#08070d;color:#ff4444;padding:2rem;font:14px/1.5 monospace;overflow:auto;word-break:break-word}
    </style>

    <!-- Global error boundary: catches fatal JS errors before React mounts -->
    <script>
      (function(){
        var errDiv;
        var reloadedKey = 'us_chunk_reload_at';
        function isChunkError(msg) {
          if (!msg) return false;
          msg = String(msg);
          return /Importing a module script failed|Failed to fetch dynamically imported module|Loading chunk \d+ failed|ChunkLoadError/i.test(msg);
        }
        function maybeReloadOnce() {
          try {
            var last = +sessionStorage.getItem(reloadedKey) || 0;
            if (Date.now() - last < 30000) return false; // already tried recently
            sessionStorage.setItem(reloadedKey, String(Date.now()));
            location.reload();
            return true;
          } catch (_) { return false; }
        }
        function showError(msg, extra) {
          console.error('[NativeBoot]', msg, extra || '');
          // Ignore benign cross-origin "Script error." with no filename/line
          if (/^Uncaught: Script error\.?$/i.test(msg) && (!extra || extra === ':0' || extra === ':')) return;
          // Stale chunk after deploy → reload once instead of showing red screen
          if (isChunkError(msg) && maybeReloadOnce()) return;
          if (!errDiv) errDiv = document.getElementById('native-error-overlay');
          if (errDiv) {
            errDiv.style.display = 'block';
            errDiv.innerHTML += '<p>' + msg + '</p>' + (extra ? '<pre>' + extra + '</pre>' : '');
          }
        }
        window.addEventListener('error', function(e) {
          showError('Uncaught: ' + e.message, e.filename + ':' + e.lineno);
        });
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason && (e.reason.message || e.reason.toString && e.reason.toString()) || e.reason;
          showError('Unhandled promise: ' + reason);
        });
      })();
    </script>

    <div id="root"></div>
    <div id="root-skeleton" aria-hidden="true">
      <img src="/uprising-logo.png" alt="" width="64" height="64" />
    </div>
    <div id="native-error-overlay"></div>
    <script type="module" src="./src/main.tsx"></script>
